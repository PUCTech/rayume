$kind: http-request
url: "{{baseUrl}}/templates/{{templateSlug}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('returns the LaTeX source', () => pm.expect(pm.response.json().tex_source).to.be.a('string'));
order: 2000
