name: Frontend

on:
  pull_request:
  push:
    branches: [main]

# a new push to the same branch cancels the run it replaces
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # fails if package-lock.json is out of date
      - name: Install dependencies
        run: npm ci

      # warnings are reported, only errors fail the job
      - name: Lint
        run: npm run lint

      # also type-checks the whole app
      - name: Build
        run: npm run build
